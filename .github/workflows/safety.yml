name: Read-only safety tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reject tracked credentials
        run: python scripts/check_tracked_secrets.py
      - name: Run offline tests
        run: python audit_integration.py
      - name: Compile source
        run: python -m compileall -q core strategies main.py account_preflight.py account_performance.py tests
