name: Read-only safety tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reject tracked credentials
        run: python scripts/check_tracked_secrets.py
      - name: Run offline tests
        run: python audit_integration.py
      - name: Compile source
        run: python -m compileall -q core strategies main.py account_preflight.py account_performance.py account_limits.py position_watch.py shadow_performance.py reconcile_journal.py observe_30m.py summarize_monitor.py collect_shadow.py forward_evidence.py collect_mlb_microstructure.py microstructure_report.py audit_weather_sources.py weather_forward.py weather_forward_report.py weather_calibration.py weather_calibration_report.py pilot_live.py fund_pilot.py tests scripts
      - name: Probe Kalshi public API with strict TLS (informational)
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 20 \
            'https://external-api.kalshi.com/trade-api/v2/markets?limit=1' \
            -o /tmp/kalshi-public-market.json
          python -c 'import json; assert isinstance(json.load(open("/tmp/kalshi-public-market.json"))["markets"], list); print("Kalshi public TLS and JSON verified")'
      - name: Ephemeral authenticated account GETs (no orders)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          KALSHI_CI_KEY_ID: ${{ secrets.KALSHI_CI_KEY_ID }}
          KALSHI_CI_PRIVATE_KEY: ${{ secrets.KALSHI_CI_PRIVATE_KEY }}
        run: python -m scripts.ci_account_readonly
